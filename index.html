 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Afkar Schools Katsina - School Management System</title>

<style>

:root{

.container{
padding:15px;

}

.card{
backg
  <section id="students" class="page hidden">

<div class="card">

<h2>Student Records</h2>

<input
class="search"
id="studentSearch"
placeholder="Search student by name, ID or class..."
oninput="renderStudents()"
>

<table>

<thead>
<tr>
<th>Student ID</th>
<th>Name</th>
<th>Gender</th>
<th>Class</th>
<th>Parent/Guardian</th>
<th>Phone</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="studentsTable"></tbody>

</table>

</div>

</section>


<section id="register" class="page hidden">

<div class="card">

<h2>Register New Student</h2>

<form id="studentForm">

<div class="form-group">

<label>Student ID / Admission No.</label>

<input
id="studentId"
required
placeholder="e.g. AFK/001/2026"
>

</div>


<div class="form-group">

<label>Full Name</label>

<input
id="studentName"
required
placeholder="Student full name"
>

</div>


<div class="form-group">

<label>Gender</label>

<select id="gender" required>

<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>

</select>

</div>


<div class="form-group">

<label>Date of Birth</label>

<input
type="date"
id="dob"
>

</div>


<div class="form-group">

<label>Class</label>

<input
id="className"
required
placeholder="e.g. JSS 1"
>

</div>


<div class="form-group">

<label>Parent / Guardian</label>

<input
id="parent"
placeholder="Parent or guardian name"
>

</div>


<div class="form-group">

<label>Phone Number</label>

<input
id="phone"
placeholder="08000000000"
>

</div>


<div class="form-group">

<label>Session</label>

<input
id="session"
value="2026/2027"
>

</div>


<div class="full">

<button
class="btn btn-primary"
type="submit"
>
Save Student

</section>


<section id="results" class="page hidden">

<div class="card">

<h2>Enter Student Result</h2>

<form id="resultForm">

<div class="form-group">

<label>Student</label>

<select id="resultStudent" required></select>

</div>


<div class="form-group">

<input type="number" id="science" min="0" max="100" required>

<input type="number" id="social" min="0" max="100" required>
</div>

</div>


<div class="form-group">
<label>Computer Studies</label>
<input type="number" id="computer" min="0" max="100" required>
</div>


<div class="form-group">
<label>Agricultural Science</label>
<input type="number" id="agriculture" min="0" max="100" required>

<button
class="btn btn-primary"

>
Save Result

<div class="card">

<h2>Saved Results</h2>

<table>

<thead>

<tr>

</div>

</section>
  <section id="fees" class="page hidden">

<div class="card">

<h2>School Fees & Payments</h2>

<form id="paymentForm">

<div class="form-group">
<label>Student</label>
<select id="paymentStudent" required></select>
</div>

<div class="form-group">
<label>Fee Type</label>
<select id="feeType">
<option>School Fees</option>
<option>Examination Fee</option>
<option>Uniform</option>
<option>Books</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Total Amount Due (₦)</label>
<input type="number" id="amountDue" min="0" required>
</div>

<div class="form-group">
<label>Amount Paid (₦)</label>
<input type="number" id="amountPaid" min="0" required>
</div>

<div class="form-group">
<label>Payment Date</label>
<input type="date" id="paymentDate" required>
</div>

<div class="form-group">
<label>Payment Method</label>
<select id="paymentMethod">
<option>Cash</option>
<option>Bank Transfer</option>
<option>POS</option>
<option>Other</option>
</select>
</div>

<div class="full">

<button
class="btn btn-primary"
type="submit">
Save Payment
</button>

</div>

</form>

</div>


<div class="card">

<h2>Payment Records</h2>

<table>

<thead>

<tr>
<th>Receipt</th>
<th>Student</th>
<th>Fee Type</th>
<th>Amount Due</th>
<th>Paid</th>
<th>Balance</th>
<th>Date</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="paymentsTable"></tbody>

</table>

</div>

</section>


<section id="compiler" class="page hidden">

<div class="card">

<h2>Result Compiler</h2>

<p>
Select a student and term to view and print the complete report card.
</p>

<div class="form-group">

<label>Student</label>

<select id="compilerStudent"></select>

</div>

<br>

<div class="form-group">

<label>Term</label>

<select id="compilerTerm">

<option>First Term</option>
<option>Second Term</option>
<option>Third Term</option>

</select>

</div>

<br>

<button
class="btn btn-maroon"
onclick="compileSelectedResult()">
Compile Report Card
</button>

</div>

<div id="compiledReport"></div>

</section>


</div>
  <script>

let students = JSON.parse(
localStorage.getItem("afkar_students") || "[]"
);

let results = JSON.parse(
localStorage.getItem("afkar_results") || "[]"
);

let payments = JSON.parse(
localStorage.getItem("afkar_payments") || "[]"
);


function saveDatabase(){

localStorage.setItem(
"afkar_students",
JSON.stringify(students)
);

localStorage.setItem(
"afkar_results",
JSON.stringify(results)
);

localStorage.setItem(
"afkar_payments",
JSON.stringify(payments)
);

}


function showPage(page){

document.querySelectorAll(".page")
.forEach(p => p.classList.add("hidden"));

const selected =
document.getElementById(page);

if(selected){
selected.classList.remove("hidden");
}

updateDashboard();
renderStudents();
populateStudents();
renderResults();
renderPayments();

}


function updateDashboard(){

document.getElementById("studentCount")
.textContent = students.length;

document.getElementById("resultCount")
.textContent = results.length;

document.getElementById("paymentCount")
.textContent = payments.length;

let balance = payments.reduce(
(sum,p) =>
sum + ((Number(p.amountDue)||0) -
(Number(p.amountPaid)||0)),
0
);

document.getElementById("outstanding")
.textContent = money(balance);

}


function money(amount){

return "₦" +
Number(amount || 0)
.toLocaleString("en-NG");

}


function esc(text){

return String(text ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

  }
  /* STUDENT REGISTRATION */

document.getElementById("studentForm")
.addEventListener("submit",function(e){

e.preventDefault();

const student = {

id:document.getElementById("studentId").value.trim(),

name:document.getElementById("studentName").value.trim(),

gender:document.getElementById("gender").value,

dob:document.getElementById("dob").value,

className:document.getElementById("className").value.trim(),

parent:document.getElementById("parent").value.trim(),

phone:document.getElementById("phone").value.trim(),

session:document.getElementById("session").value

};


if(students.some(s => s.id === student.id)){

alert("A student with this ID already exists.");

return;

}


students.push(student);

saveDatabase();

this.reset();

document.getElementById("session")
.value="2026/2027";

populateStudents();

renderStudents();

updateDashboard();

alert("Student registered successfully!");

showPage("students");

});
  /* STUDENT LIST */

function renderStudents(){

const search =
(document.getElementById("studentSearch")?.value || "")
.toLowerCase();

const table =
document.getElementById("studentsTable");

if(!table)return;

table.innerHTML = students

.filter(s =>
s.name.toLowerCase().includes(search) ||
s.id.toLowerCase().includes(search) ||
s.className.toLowerCase().includes(search)
)

.map(s => `

<tr>

<td>${esc(s.id)}</td>

<td>${esc(s.name)}</td>

<td>${esc(s.gender)}</td>

<td>${esc(s.className)}</td>

<td>${esc(s.parent)}</td>

<td>${esc(s.phone)}</td>

<td>

<button
class="btn btn-maroon"
onclick="studentReport('${s.id}')">
Report
</button>

<button
class="btn btn-danger"
onclick="deleteStudent('${s.id}')">
Delete
</button>

</td>

</tr>

`).join("");

}


function deleteStudent(id){

if(!confirm("Delete this student?"))return;

students =
students.filter(s => s.id !== id);

results =
results.filter(r => r.studentId !== id);

payments =
payments.filter(p => p.studentId !== id);

saveDatabase();

renderStudents();

populateStudents();

renderResults();

renderPayments();

updateDashboard();

  }
  /* STUDENT DROPDOWNS */

function populateStudents(){

const selects = [

document.getElementById("resultStudent"),

document.getElementById("paymentStudent"),

document.getElementById("compilerStudent")

];

selects.forEach(select => {

if(!select)return;

select.innerHTML =
'<option value="">Select Student</option>' +

students.map(s => `

<option value="${esc(s.id)}">
${esc(s.name)} - ${esc(s.className)}
</option>

`).join("");

});

}


/* RESULT CALCULATION */

function calculateResult(r){

const subjects = [

Number(r.math)||0,
Number(r.english)||0,
Number(r.science)||0,
Number(r.social)||0,
Number(r.religion)||0,
Number(r.computer)||0,
Number(r.agriculture)||0,
Number(r.civic)||0

];

const total =
subjects.reduce((a,b)=>a+b,0);

const average =
subjects.length ? total / subjects.length : 0;

return {
total,
average,
grade:getGrade(average)
};

}


function getGrade(score){

if(score>=75)return "A";

if(score>=65)return "B";

if(score>=55)return "C";

if(score>=45)return "D";

if(score>=40)return "E";

return "F";

}


function remark(score){

if(score>=75)return "Excellent";

if(score>=65)return "Very Good";

if(score>=55)return "Good";

if(score>=45)return "Pass";

if(score>=40)return "Fair";

return "Fail";

  }
   /* SAVE RESULT */

document.getElementById("resultForm")
.addEventListener("submit",function(e){

e.preventDefault();

const studentId =
document.getElementById("resultStudent").value;

if(!studentId){

alert("Please select a student.");

return;

}

const result = {

id:Date.now().toString(),

studentId:studentId,

term:document.getElementById("term").value,

math:Number(document.getElementById("math").value),

english:Number(document.getElementById("english").value),

science:Number(document.getElementById("science").value),

social:Number(document.getElementById("social").value),

religion:Number(document.getElementById("religion").value),

computer:Number(document.getElementById("computer").value),

agriculture:Number(document.getElementById("agriculture").value),

civic:Number(document.getElementById("civic").value)

};


results.push(result);

saveDatabase();

this.reset();

populateStudents();

renderResults();

updateDashboard();

alert("Result saved successfully!");

});
  /* RESULTS TABLE */

function renderResults(){

const body =
document.getElementById("resultsTable");

if(!body)return;

body.innerHTML = results.map(r => {

const s =
students.find(x => x.id === r.studentId);

if(!s)return "";

const c =
calculateResult(r);

return `

<tr>

<td>${esc(s.name)}</td>

<td>${esc(s.className)}</td>

<td>${esc(r.term)}</td>

<td>${c.total}</td>

<td>${c.average.toFixed(2)}%</td>

<td>

<button
class="btn btn-primary"
onclick="studentReport('${s.id}')">
Report
</button>

<button
class="btn btn-danger"
onclick="deleteResult('${r.id}')">
Delete
</button>

</td>

</tr>

`;

}).join("");

}


function deleteResult(id){

if(!confirm("Delete this result?"))return;

results =
results.filter(r => r.id !== id);

saveDatabase();

renderResults();

updateDashboard();

  }
  /* REPORT CARD */

function studentReport(studentId){

const student =
students.find(s => s.id === studentId);

if(!student){

alert("Student not found.");

return;

}

const studentResults =
results.filter(r => r.studentId === studentId);

if(studentResults.length === 0){

alert("No result has been entered for this student yet.");

return;

}

const latest =
studentResults[studentResults.length - 1];

document.getElementById("compilerStudent").value =
studentId;

document.getElementById("compilerTerm").value =
latest.term;

showPage("compiler");

compileSelectedResult();

}


function compileSelectedResult(){

const studentId =
document.getElementById("compilerStudent").value;

const term =
document.getElementById("compilerTerm").value;

const student =
students.find(s => s.id === studentId);

const result =
results.find(r =>
r.studentId === studentId &&
r.term === term
);

if(!student){

alert("Please select a student.");

return;

}

if(!result){

document.getElementById("compiledReport").innerHTML = `

<div class="card">

<h2>No Result Found</h2>

<p>
There is no result for
<strong>${esc(student.name)}</strong>
for ${esc(term)}.
</p>

</div>

`;

return;

}

document.getElementById("compiledReport").innerHTML =
buildReportHTML(student,result);

  }
  function buildReportHTML(student,r){

const subjects = [

["Mathematics",r.math],
["English Language",r.english],
["Basic Science",r.science],
["Social Studies",r.social],
["Islamic / Religious Studies",r.religion],
["Computer Studies",r.computer],
["Agricultural Science",r.agriculture],
["Civic Education",r.civic]

];

const calculated =
calculateResult(r);

let rows = subjects.map(x => {

const score = Number(x[1]) || 0;

return `

<tr>

<td>${esc(x[0])}</td>

<td>${score}</td>

<td>${getGrade(score)}</td>

<td>${remark(score)}</td>

</tr>

`;

}).join("");

return `

<div class="card" id="reportCard">

<div style="text-align:center">

<h1 style="color:#075b35;margin-bottom:5px">
AFKAR SCHOOLS KATSINA
</h1>

<h3 style="margin-top:0">
STUDENT REPORT CARD
</h3>

<p>
<strong>${esc(r.term)}</strong>
</p>

</div>


<hr>


<table>

<tr>
<td><strong>Student ID</strong></td>
<td>${esc(student.id)}</td>

<td><strong>Student Name</strong></td>
<td>${esc(student.name)}</td>
</tr>

<tr>
<td><strong>Class</strong></td>
<td>${esc(student.className)}</td>

<td><strong>Gender</strong></td>
<td>${esc(student.gender)}</td>
</tr>

<tr>
<td><strong>Session</strong></td>
<td>${esc(student.session)}</td>

<td><strong>Date of Birth</strong></td>
<td>${esc(student.dob)}</td>
</tr>

</table>


<h3 style="color:#075b35">
Academic Performance
</h3>


<table>

<thead>

<tr>
<th>Subject</th>
<th>Score</th>
<th>Grade</th>
<th>Remark</th>
</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>


<div style="
margin-top:20px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
">

<div class="card">

<strong>Total</strong>

<h2>
${calculated.total}
</h2>

</div>


<div class="card">

<strong>Average</strong>

<h2>
${calculated.average.toFixed(2)}%
</h2>

</div>


<div class="card">

<strong>Overall Grade</strong>

<h2>
${calculated.grade}
</h2>

<p>
${remark(calculated.average)}
</p>

</div>

</div>


<div class="no-print" style="margin-top:20px">

<button
class="btn btn-primary"
onclick="printReport('${r.id}')">

🖨️ Print Report Card

</button>

</div>


<div style="
margin-top:60px;
display:flex;
justify-content:space-between;
">

<div>
_________________________<br>
Class Teacher's Signature
</div>

<div>
_________________________<br>
Principal's Signature
</div>

</div>

</div>

`;

  }
  /* PRINT REPORT */

function printReport(resultId){

const result =
results.find(r => r.id === resultId);

if(!result){

alert("Result not found.");

return;

}

const student =
students.find(s => s.id === result.studentId);

if(!student){

alert("Student not found.");

return;

}

const report =
buildReportHTML(student,result);

const win =
window.open("","_blank");

if(!win){

alert("Please allow pop-ups in your browser.");

return;

}

win.document.write(`

<!DOCTYPE html>

<html>

<head>

<title>
Afkar Schools Katsina - Report Card
</title>

<style>

body{
font-family:Arial,sans-serif;
padding:25px;
color:#222;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
border:1px solid #999;
padding:9px;
}

th{
background:#075b35;
color:white;
}

button{
padding:10px 18px;
background:#075b35;
color:white;
border:0;
border-radius:5px;
}

@media print{

button{
display:none;
}

body{
padding:0;
}

}

</style>

</head>

<body>

${report}

<script>

window.onload=function(){

window.print();

};

<\/script>

</body>

</html>

`);

win.document.close();

  }
  /* SAVE PAYMENT */

document.getElementById("paymentForm")
.addEventListener("submit",function(e){

e.preventDefault();

const studentId =
document.getElementById("paymentStudent").value;

if(!studentId){

alert("Please select a student.");

return;

}

const payment = {

id:Date.now().toString(),

receipt:
"AFK-" + Date.now().toString().slice(-6),

studentId:studentId,

feeType:
document.getElementById("feeType").value,

amountDue:
Number(document.getElementById("amountDue").value) || 0,

amountPaid:
Number(document.getElementById("amountPaid").value) || 0,

date:
document.getElementById("paymentDate").value,

method:
document.getElementById("paymentMethod").value

};


if(payment.amountPaid > payment.amountDue){

alert("Amount paid cannot be greater than amount due.");

return;

}


payments.push(payment);

saveDatabase();

this.reset();

populateStudents();

renderPayments();

updateDashboard();

alert(
"Payment saved successfully!\nReceipt No: " +
payment.receipt
);

});
/* PAYMENT RECORDS */

function renderPayments(){

const table =
document.getElementById("paymentsTable");

if(!table)return;

table.innerHTML = payments.map(p => {

const student =
students.find(s => s.id === p.studentId);

if(!student)return "";

const balance =
(Number(p.amountDue)||0) -
(Number(p.amountPaid)||0);

return `

<tr>

<td>${esc(p.receipt)}</td>

<td>${esc(student.name)}</td>

<td>${esc(p.feeType)}</td>

<td>${money(p.amountDue)}</td>

<td>${money(p.amountPaid)}</td>

<td>${money(balance)}</td>

<td>${esc(p.date)}</td>

<td>

<button
class="btn btn-primary"
onclick="printReceipt('${p.id}')">

Receipt

</button>

<button
class="btn btn-danger"
onclick="deletePayment('${p.id}')">

Delete

</button>

</td>

</tr>

`;

}).join("");

}


function deletePayment(id){

if(!confirm("Delete this payment record?"))
return;

payments =
payments.filter(p => p.id !== id);

saveDatabase();

renderPayments();

updateDashboard();

  }
  /* PRINT RECEIPT */

function printReceipt(paymentId){

const p =
payments.find(x => x.id === paymentId);

if(!p){

alert("Payment not found.");

return;

}

const student =
students.find(s => s.id === p.studentId);

if(!student){

alert("Student not found.");

return;

}

const balance =
(Number(p.amountDue)||0) -
(Number(p.amountPaid)||0);

const win =
window.open("","_blank");

if(!win){

alert("Please allow pop-ups in your browser.");

return;

}

win.document.write(`

<!DOCTYPE html>

<html>

<head>

<title>
Afkar Schools Katsina - Fee Receipt
</title>

<style>

body{
font-family:Arial,sans-serif;
padding:30px;
color:#222;
}

.receipt{
max-width:700px;
margin:auto;
border:2px solid #075b35;
padding:25px;
}

h1{
text-align:center;
color:#075b35;
margin-bottom:5px;
}

h2{
text-align:center;
color:#6d1830;
}

table{

  /* BACKUP DATA */

function backupData(){

const data = {

school:"Afkar Schools Katsina",

date:new Date().toISOString(),

students:students,

results:results,

payments:payments

};

const blob =
new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href=url;

a.download="afkar-schools-backup.json";

a.click();

URL.revokeObjectURL(url);

}
